name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format . --check
      
      - name: Sort imports with isort
        run: |
          isort --check-only .
      
      - name: Type check with mypy
        run: |
          mypy src/
      
      - name: Test with pytest
        run: |
          pytest --cov=src/digital_me_community --cov-report=xml --cov-report=term-missing --cov-fail-under=85
      
      - name: Security scan with Bandit
        run: |
          pip install bandit
          bandit -r src -ll
      
      - name: Dependency audit with Safety
        run: |
          pip install safety
          safety check --full-report || true
      
      - name: Display coverage results
        run: |
          echo "Coverage report generated successfully"
          if [ -f coverage.xml ]; then
            echo "✅ Coverage XML report available"
          else
            echo "❌ Coverage XML report not found"
          fi
      
      - name: Run example plugin demo
        run: |
          python examples/hello_plugin/hello_plugin.py

  build-package:
    runs-on: ubuntu-latest
    needs: build-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: |
          python -m build
      
      - name: Check package
        run: |
          twine check dist/*
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-package:
    runs-on: ubuntu-latest
    needs: build-package
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
      
      - name: Test installed package
        run: |
          python -c "import digital_me_community; print('Package installed successfully')"
          python -c "from digital_me_community import DigitalMeSDK, BasePlugin, PluginMetadata; print('Imports work correctly')"
      
      - name: Test example plugin
        run: |
          python examples/hello_plugin/hello_plugin.py
