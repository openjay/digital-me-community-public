name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC

jobs:
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          exit-code: 1
          no-git: false
          verbose: true

  trivy:
    name: Vulnerability Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Display Trivy scan results
        run: |
          echo "Trivy scan completed. Results saved to trivy-results.sarif"
          if [ -f trivy-results.sarif ]; then
            echo "✅ Trivy scan results generated successfully"
          else
            echo "❌ Trivy scan results not found"
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0

  bandit:
    name: Security Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security linter
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll
      
      - name: Run Safety dependency check
        run: |
          safety check --json --output safety-report.json || true
          safety check
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
      
      - name: Check licenses
        run: |
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=plain
      
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json

  policy-check:
    name: Repository Policy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for forbidden files
        run: |
          echo "Checking for forbidden file types..."
          if find . -name "*.pem" -o -name "*.key" -o -name "*.crt" -o -name "*.p12" -o -name "*.pfx" | grep -q .; then
            echo "❌ Forbidden file types found:"
            find . -name "*.pem" -o -name "*.key" -o -name "*.crt" -o -name "*.p12" -o -name "*.pfx"
            exit 1
          else
            echo "✅ No forbidden file types found"
          fi
      
      - name: Check required files
        run: |
          echo "Checking for required files..."
          required_files=("LICENSE" "README.md" "CODE_OF_CONDUCT.md" "CONTRIBUTING.md" "SECURITY.md")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Required file missing: $file"
              exit 1
            else
              echo "✅ Found required file: $file"
            fi
          done
      
      - name: Check file sizes
        run: |
          echo "Checking for large files..."
          if find . -type f -size +10M | grep -q .; then
            echo "❌ Large files found (>10MB):"
            find . -type f -size +10M
            exit 1
          else
            echo "✅ No large files found"
          fi
      
      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets in code..."
          # Check for common secret patterns
          if grep -r -i "password\|secret\|key\|token" --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" . | grep -v "test" | grep -v "example" | grep -v "stub" | grep -q .; then
            echo "⚠️  Potential secrets found in code (excluding tests and examples):"
            grep -r -i "password\|secret\|key\|token" --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" . | grep -v "test" | grep -v "example" | grep -v "stub"
            echo "Please review these matches to ensure no actual secrets are committed"
          else
            echo "✅ No potential secrets found in code"
          fi
